<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0a0a0a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #adff02; } a:hover { color: #adff02; }
    .mono { font-family: 'SF Mono', Menlo, monospace; }
  </style>
</helmet>
<div style="width: 390px; background: #0a0a0a; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;">
  <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 18px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="display: flex; width: 20px; height: 20px; align-items: center; justify-content: center; border-radius: 999px; background: rgba(47,232,235,0.2); color: #2fe8eb; font-size: 10px; font-weight: 700;">A</span>
      <span style="font-size: 15px; font-weight: 500; color: #ffffff;">Incline dumbbell press</span>
    </div>
    <p style="margin: 0; padding-left: 28px; font-size: 12px; color: #666666;">3 sets · 6-8 reps</p>
  </div>

  <div style="margin-left: 18px; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 16px; background: #141414; border: 1px solid #1a1a1a;">
    <p style="margin: 0; font-size: 17px; font-weight: 600; color: #ffffff;">Chest</p>
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
      <p style="margin: 0; font-size: 15px; color: #888888;"><span style="font-size: 17px; font-weight: 600; color: #ffffff;">{{ sets }}</span> of 16 weekly sets</p>
      <p style="margin: 0; font-size: 15px; font-weight: 500; color: {{ hintColor }};">{{ hint }}</p>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; margin-top: 10px;">
      <div style="flex: 0 0 64px; width: 64px;">
        <dc-import name="Body" view="front-torso" zones="{{ zones }}" hint-size="64px,80px"></dc-import>
      </div>
      <div style="flex: 1; display: flex; gap: 4px; height: 36px;">
        <sc-for list="{{ segments }}" as="seg" hint-placeholder-count="16">
          <span style="flex: 1; border-radius: 6px; background: {{ seg.color }}; opacity: {{ seg.opacity }};"></span>
        </sc-for>
      </div>
    </div>
    <p style="margin: 8px 0 0; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #444444;">Also front delts, triceps (half)</p>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"sets":{"editor":"range","default":8,"min":0,"max":18,"step":1},"$preview":{"width":390,"height":300}}'>
const L = { growth: 6, focus: 12, max: 16 };
const ZONE_COLORS = { maintaining:'#3B82F6', growth:'#ADFF02', focus:'#EAB308', over:'#FC7753' };
function zoneAt(n) { return n > L.max ? 'over' : n >= L.focus ? 'focus' : n >= L.growth ? 'growth' : 'maintaining'; }
class Component extends DCLogic {
  renderVals() {
    const s = this.props.sets ?? 8;
    const zone = s < 0.5 ? 'maintaining' : zoneAt(s);
    const hint = zone === 'over' ? { text: 'Over max', color: ZONE_COLORS.over }
      : zone === 'focus' ? { text: 'Focus zone', color: ZONE_COLORS.focus }
      : zone === 'growth' ? { text: 'Growth zone', color: ZONE_COLORS.growth }
      : { text: Math.ceil(L.growth - s) + ' sets to grow', color: '#888888' };
    const segments = [];
    for (let i = 1; i <= Math.max(L.max, s); i++) segments.push({ color: ZONE_COLORS[zoneAt(i)], opacity: i <= s ? 1 : 0.22 });
    return { sets: String(s), hint: hint.text, hintColor: hint.color, zones: { chest: zone }, segments };
  }
}
</script>
</body>
</html>
