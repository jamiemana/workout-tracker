<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    a { color: #adff02; } a:hover { color: #adff02; }
    .muscle { cursor: pointer; transition: opacity 160ms ease; }
  </style>
</helmet>
<div ref="{{ hostRef }}" onClick="{{ onSvgClick }}" style="width: 100%; display: block; line-height: 0;"></div>
</x-dc>
<script data-dc-script data-props='{"view":{"editor":"enum","default":"both","options":["both","front","back","front-torso","back-torso","front-legs","back-legs"]},"zones":{"editor":null,"default":{}},"selected":{"editor":null,"default":null},"dim":{"editor":null,"default":null},"onPick":{"editor":null,"default":null},"$preview":{"width":480,"height":520}}'>
const G = __GEOM__;
const ZONE_COLORS = { maintaining: '#3B82F6', growth: '#ADFF02', focus: '#EAB308', over: '#FC7753' };
const BODY = '#3a3a3a', NONE = '#232323', SELECT = '#adff02';
let uidCounter = 0;
function shape(d, fill, extra) {
  return '<path d="' + d + '" fill="' + fill + '" stroke="' + BODY + '" stroke-width="' + G.gap + '" stroke-linejoin="round"' + (extra || '') + '></path>';
}
function muscleExtra(m, zones, selected, dim) {
  const dimming = Array.isArray(dim) && dim.length > 0;
  const dimmed = dimming && !dim.includes(m);
  return ' class="muscle" data-muscle="' + m + '" style="opacity:' + (dimmed ? 0.25 : 1) + '"' + (selected === m ? ' stroke="' + SELECT + '"' : '');
}
function figure(side, cx, zones, selected, dim, uid) {
  const g = G[side];
  let out = '<g transform="translate(' + cx + ',0)">';
  for (const d of g.silhouette) out += '<path d="' + d + '" fill="' + BODY + '"></path>';
  for (const d of g.detail) out += shape(d, NONE);
  for (const m of G.order) {
    if (!g.regions[m]) continue;
    const zone = (zones && zones[m]) || 'none';
    const fill = zone !== 'none' ? ZONE_COLORS[zone] : NONE;
    for (const d of g.regions[m]) out += shape(d, fill, muscleExtra(m, zones, selected, dim));
  }
  const sz = (zones && zones.side_delt) || 'none';
  const sfill = sz !== 'none' ? ZONE_COLORS[sz] : NONE;
  g.sideDelt.forEach((sd, i) => {
    const id = 'sd-' + uid + '-' + side + '-' + i;
    const r = sd.rect;
    out += '<clipPath id="' + id + '"><rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '"></rect></clipPath>';
    out += shape(sd.d, sfill, ' clip-path="url(#' + id + ')"' + muscleExtra('side_delt', zones, selected, dim));
  });
  return out + '</g>';
}
function render(props, uid) {
  const view = props.view || 'both', zones = props.zones || {}, selected = props.selected || null, dim = props.dim || null;
  let inner = '';
  if (view === 'both') inner = figure('front', 120, zones, selected, dim, uid) + figure('back', 360, zones, selected, dim, uid);
  else if (view.startsWith('front')) inner = figure('front', 120, zones, selected, dim, uid);
  else inner = figure('back', 120, zones, selected, dim, uid);
  return '<svg viewBox="' + G.viewbox[view] + '" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block" role="img" aria-label="Muscle map">' + inner + '</svg>';
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.host = null;
    this.uid = String(++uidCounter);
    this.hostRef = (el) => { this.host = el; this.paint(); };
    this.onSvgClick = (e) => {
      const t = e && e.target && e.target.closest ? e.target.closest('[data-muscle]') : null;
      if (t && typeof this.props.onPick === 'function') this.props.onPick(t.getAttribute('data-muscle'));
    };
  }
  paint() { if (this.host) this.host.innerHTML = render(this.props, this.uid); }
  componentDidMount() { this.paint(); }
  componentDidUpdate() { this.paint(); }
  renderVals() { return { hostRef: this.hostRef, onSvgClick: this.onSvgClick }; }
}
</script>
</body>
</html>
